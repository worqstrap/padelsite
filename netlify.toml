[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/coaching/private"
  to = "/coaching/private-padel-coaching-nairobi"
  status = 301

[[redirects]]
  from = "/coaching/beginner"
  to = "/coaching/beginner-padel-coaching-nairobi"
  status = 301

[[redirects]]
  from = "/courts"
  to = "/padel-courts"
  status = 301
